plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = '0.1.3'
group = 'com.thelongtravail'

base {
    archivesName = 'The_Long_Travail'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { the_long_travail { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { the_long_travail { source sourceSets.main } }
        }
    }
}

jarJar.enable()

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup('mezz.jei') }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeModule('maven.modrinth', 'embeddium')
            includeModule('maven.modrinth', 'jade')
            includeModule('maven.modrinth', 'R0bDWFAW')
            includeModule('maven.modrinth', 'apotheosis')
            includeModule('maven.modrinth', 'placebo')
            includeModule('maven.modrinth', 'quark')
            includeModule('maven.modrinth', 'zeta')
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1')
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
    }
}

apply from: 'gradle/optional-compat.gradle'

mixin {
    add sourceSets.main, 'mixins.the_long_travail.refmap.json'
    config 'mixins.the_long_travail.json'
    config 'mixins.the_long_travail.compat.json'
}

jar {
    archiveClassifier = 'slim'
    manifest {
        attributes([
            'Specification-Title': 'the_long_travail',
            'Specification-Vendor': 'the_long_travail',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'the_long_travail',
            'MixinConfigs': 'mixins.the_long_travail.json,mixins.the_long_travail.compat.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.named('jarJar').configure {
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}
reobf { jarJar {} }

apply from: 'gradle/language.gradle'

apply from: 'gradle/compat-checks.gradle'

apply from: 'gradle/config-checks.gradle'
