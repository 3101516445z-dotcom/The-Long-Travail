tasks.register('testOptionalCompatibility', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.thelongtravail.compat.OptionalCompatTest'
    if (providers.gradleProperty('compatTestJars').isPresent()) {
        args providers.gradleProperty('compatTestJars').get().split(';')
    }
}

tasks.named('check') {
    dependsOn tasks.named('testOptionalCompatibility')
}
