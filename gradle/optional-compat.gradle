// 可选联动的编译依赖；不内嵌到正式包，也不自动加入开发运行环境。
dependencies {
    compileOnly fg.deobf('maven.modrinth:apotheosis:tT3CLYvK') // 1.20.1 / 7.4.8
    compileOnly fg.deobf('maven.modrinth:placebo:6SkuAGoz') // 8.6.3
    compileOnly fg.deobf('maven.modrinth:quark:DijQLauD') // 4.0-462
    compileOnly fg.deobf('maven.modrinth:zeta:mSER3jBI') // 1.0-31
    compileOnly fg.deobf('top.theillusivec4.caelus:caelus-forge:3.2.0+1.20.1')
    compileOnly fg.deobf('maven.modrinth:embeddium:UTbfe5d1') // Minecraft 1.20.1 的 0.3.31 版本。
    compileOnly fg.deobf('maven.modrinth:jade:xJQHCmWJ') // Forge 的 11.13.3 版本。
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.132')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.132')
}

// 固定使用 Minecraft 1.20.1 Forge 的女仆 1.5.3；默认通过 Maven 获取。
// 离线开发可用 -PmaidApiJar 指定本地 JAR，不在仓库中保存机器专用路径。
def maidApiRepo = layout.buildDirectory.dir('optional-api').get().asFile
maidApiRepo.mkdirs()
repositories { flatDir { dirs maidApiRepo } }

ext.maidApiDependency = 'maven.modrinth:R0bDWFAW:g1SKoGQJ'
def maidApiOverride = providers.gradleProperty('maidApiJar')
if (maidApiOverride.isPresent()) {
    def maidApiJar = file(maidApiOverride.get())
    if (!maidApiJar.isFile()) throw new GradleException("Missing maidApiJar: " + maidApiJar)
    copy { from maidApiJar; into maidApiRepo; rename { 'touhoulittlemaid-1.5.3-forge+mc1.20.1.jar' } }
    ext.maidApiDependency = 'local:touhoulittlemaid:1.5.3-forge+mc1.20.1'
}
dependencies { compileOnly fg.deobf(project.ext.maidApiDependency) }

// 可选 API 只用于编译，不打入发布包，也不自动装入开发服务端。
// 使用 tools/structure-regression/prepare-direct-compat.py 准备固定版本的 API。
def directApiDirectory = file(providers.gradleProperty('compatApiDirectory').getOrElse('build/direct-compat-api'))
def directApiNames = ['attributeslib', 'ftbteams', 'ftbultimine', 'architectury', 'ftblibrary',
                      'gravestone', 'maidspell', 'refinedstorage', 'sophisticatedbackpacks',
                      'sophisticatedcore', 'rs_integration', 'appliedenergistics2', 'beyonddimensions']
def missingDirectApis = directApiNames.findAll { !new File(directApiDirectory, "${it}-local.jar").isFile() }
if (!missingDirectApis.isEmpty()) {
    throw new GradleException("Missing compile-only APIs: ${missingDirectApis.join(', ')}. Run tools/structure-regression/prepare-direct-compat.py; see tools/structure-regression/direct-compat/README.md")
}
repositories { flatDir { dirs directApiDirectory } }
dependencies {
    directApiNames.each { name ->
        compileOnly fg.deobf("travail.optional:${name}:local")
    }
}
