// Optional APIs used only by com.thelongtravail.compat; never bundled or required at runtime.
dependencies {
    compileOnly fg.deobf('top.theillusivec4.caelus:caelus-forge:3.2.0+1.20.1')
    compileOnly fg.deobf('maven.modrinth:embeddium:UTbfe5d1') // 0.3.31 for 1.20.1
    compileOnly fg.deobf('maven.modrinth:jade:xJQHCmWJ') // 11.13.3 Forge
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.132')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.132')
}

// Fixed Forge 1.20.1 / 1.5.3 artifact; compile-only, never bundled.
// An explicit local override is available for offline development.
def maidApiRepo = layout.buildDirectory.dir('optional-api').get().asFile
maidApiRepo.mkdirs()
repositories { flatDir { dirs maidApiRepo } }

ext.maidApiDependency = 'maven.modrinth:R0bDWFAW:g1SKoGQJ'
def maidApiOverride = providers.gradleProperty('maidApiJar')
if (maidApiOverride.isPresent()) {
    def maidApiJar = file(maidApiOverride.get())
    if (!maidApiJar.isFile()) throw new GradleException("Missing maidApiJar: " + maidApiJar)
    copy { from maidApiJar; into maidApiRepo; rename { 'touhoulittlemaid-1.5.3-forge+mc1.20.1.jar' } }
    ext.maidApiDependency = 'local:touhoulittlemaid:1.5.3-forge+mc1.20.1'
}
dependencies { compileOnly fg.deobf(project.ext.maidApiDependency) }
