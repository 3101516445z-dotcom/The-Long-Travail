tasks.register('testConfigRecovery', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.thelongtravail.config.storage.ConfigRecoveryTest'
    args layout.buildDirectory.get().asFile.absolutePath
}

tasks.named('check') {
    dependsOn 'testConfigLayout'
    dependsOn tasks.named('testConfigRecovery')
    dependsOn tasks.named('testConfigDiagnostics')
    dependsOn 'testBiomeCompatDefaults'
    dependsOn 'testStructureCompatDefaults'
    dependsOn 'testRewardCompatDefaults'
    dependsOn 'testFishingEntityCompatDefaults'
    dependsOn 'testEffectCompatDefaults'
    dependsOn 'testGoldenAgeCompatDefaults'
    dependsOn 'testYoukaiCompatDefaults'
    dependsOn 'testCompatCombinations'
}

tasks.register('testConfigLayout', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.thelongtravail.config.storage.ConfigLayoutTest'
    args layout.buildDirectory.dir('reports/config-layout').get().asFile.absolutePath
}

