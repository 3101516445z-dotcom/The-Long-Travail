allprojects {
    afterEvaluate {
        if (project.hasProperty('visualOculus')) {
            repositories.flatDir { dirs '../../mods' }
            dependencies {
                runtimeOnly fg.deobf('local:oculus:mc1.20.1-1.8.0')
                runtimeOnly fg.deobf('local:embeddium:0.3.31+mc1.20.1')
            }
        }
        sourceSets {
            visualReview {
                java.srcDirs = ['tools/visual-client']
                resources.srcDir 'tools/visual-resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.client {
            workingDirectory project.file('build/visual-client')
            args '--quickPlaySingleplayer', 'visual-world', '--width', '960', '--height', '540'
            mods {
                the_long_travail { source sourceSets.main }
                travail_visual_smoke { source sourceSets.visualReview }
            }
        }
    }
}
