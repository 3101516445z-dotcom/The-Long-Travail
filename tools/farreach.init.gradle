allprojects {
    afterEvaluate {
        def directory = project.file('build/farreach-review-server')
        sourceSets {
            farreachTest {
                java.srcDir 'tools/farreach-smoke'
                resources.srcDir 'tools/smoke-resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.server {
            workingDirectory directory
            args '--nogui'
            mods { travail_smoke { source sourceSets.farreachTest } }
        }
        tasks.named('compileFarreachTestJava') { source project.file('tools/smoke/CombatRulesSmoke.java'); source project.file('tools/smoke/LegacyLootBaseline.java') }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                def eula = new File(directory, 'eula.txt')
                if (!eula.exists()) eula.text = project.file('run/eula.txt').text
                def properties = new File(directory, 'server.properties')
                if (!properties.exists()) properties.text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25581\nlevel-name=farreach-test\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=0\n'
                new File(directory, 'farreach-result.txt').text = 'NOT_RUN'
            }
            doLast {
                def result = new File(directory, 'farreach-result.txt')
                if (!result.exists() || result.text.trim() != 'PASS') throw new GradleException('Far Reach isolated-server tests failed; inspect build/farreach-review-server/logs/latest.log')
            }
        }
    }
}
