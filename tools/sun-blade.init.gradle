allprojects {
    afterEvaluate {
        def directory = project.file('build/sun-blade-server')
        sourceSets {
            sunBladeTest {
                java.srcDir 'tools/sun-blade-smoke'
                resources.srcDir 'tools/sun-blade-smoke/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.server {
            workingDirectory directory
            args '--nogui'
            property 'mixin.debug.countInjections', 'true'
            property 'travail.sun.damageOnly', project.hasProperty('damageOnly').toString()
            if (project.hasProperty('damageTrace')) {
                property 'thelongtravail.damageTrace', 'true'
                property 'thelongtravail.damageTrace.limit', '256'
            }
            mods { travail_smoke { source sourceSets.sunBladeTest } }
        }
        tasks.register('sunBladeTestJar', Jar) {
            from sourceSets.sunBladeTest.output
            archiveBaseName = 'travail-sun-blade-test'
            archiveVersion = '1'
        }
        reobf { sunBladeTestJar { classpath.from sourceSets.sunBladeTest.compileClasspath } }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25743\nlevel-name=sun-blade-test\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=60000\n'
                new File(directory, 'sun-blade-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (!new File(directory, 'sun-blade-result.txt').text.startsWith('PASS '))
                    throw new GradleException('Sun Chaser / Kagotsurube integration checks failed')
            }
        }
    }
}
