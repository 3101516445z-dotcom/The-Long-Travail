allprojects {
    afterEvaluate {
        dependencies { runtimeOnly fg.deobf(project.ext.maidApiDependency) }
        def directory = project.file('build/structure-round-12-' + (project.findProperty('structurePhase') ?: 'after'))
        sourceSets {
            combatStructureTest {
                java.srcDir 'tools/structure-regression/combat'
                resources.srcDir 'tools/structure-regression/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.server {
            workingDirectory directory
            property 'travail.attributes.expectMaid', 'true'
            args '--nogui'
            mods { travail_smoke { source sourceSets.combatStructureTest } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25654\nlevel-name=maid-structure-test\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=60000\n'
                new File(directory, 'combat-attributes-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (new File(directory, 'combat-attributes-result.txt').text.startsWith('PASS') == false) throw new GradleException('Maid structural regression failed')
            }
        }
    }
}
