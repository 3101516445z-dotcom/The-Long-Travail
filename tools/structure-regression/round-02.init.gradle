allprojects {
    afterEvaluate {
        def directory = project.file('build/structure-round-02-' + (project.findProperty('structurePhase') ?: 'after'))
        sourceSets {
            journeyApiTest {
                java.srcDir 'tools/structure-regression/journey'

                java.include '**/JourneyApiSmoke.java', '**/StateApiSmoke.java', '**/RenewalSmoke.java', '**/JourneyQuerySmoke.java', '**/WayguideCursorChecks.java', '**/FrozenPlacementCursor.java'
                resources.srcDir 'tools/structure-regression/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.server {
            workingDirectory directory
            args '--nogui'
            mods { travail_smoke { source sourceSets.journeyApiTest } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25644\nlevel-name=journey-api-test\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=60000\n'
                new File(directory, 'journey-api-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (new File(directory, 'journey-api-result.txt').text.trim() != 'PASS') throw new GradleException('Journey API regression failed')
            }
        }
    }
}
