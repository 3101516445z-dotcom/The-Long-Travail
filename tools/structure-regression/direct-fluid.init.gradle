allprojects {
    afterEvaluate {
        dependencies { runtimeOnly fg.deobf('travail.optional:beyonddimensions:local') }
        def combination = Integer.parseInt(project.findProperty('matrix') ?: '0')
        if (combination < 0 || combination >= 12) throw new GradleException('matrix must be 0..11')
        boolean ae = (combination & 1) != 0
        boolean bags = (combination & 2) != 0
        int rs = (int)(combination / 4)
        def names = []
        if (ae) names.addAll(['appliedenergistics2', 'guideme'])
        if (bags) names.addAll(['sophisticatedcore', 'sophisticatedbackpacks'])
        if (rs > 0) names.add('refinedstorage')
        if (rs > 1) names.add('rs_integration')
        names.each { name ->
            dependencies { runtimeOnly fg.deobf("travail.optional:${name}:local") }
        }
        sourceSets {
            fluidMatrixTest {
                java.srcDirs = ['tools/backpack-fluid-smoke', 'tools/rs-fluid-smoke', 'tools/ae-fluid-smoke', 'tools/fluid-matrix-smoke', 'tools/structure-regression/rsi153']
                resources.srcDir 'tools/smoke-resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        def directory = project.file(project.hasProperty('directRun') ? 'build/reflection-removal/' + project.property('directRun') : ("build/reflection-removal/fluid-${combination}"))
        minecraft.runs.server {
            workingDirectory directory
            property 'travail.beyondStress', (!project.hasProperty('matrixOnly')).toString()
            property 'travail.beyondRestart', project.hasProperty('stressRestart').toString()
            property 'travail.rsi153', project.hasProperty('rsi153').toString()
            property 'travail.fluidMatrix', "${combination}"
            args '--nogui'
            mods { travail_smoke { source sourceSets.fluidMatrixTest } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                if (bags) {
                    def seed = new File(directory, 'config/sophisticatedcore-common.toml')
                    if (!seed.exists()) { seed.parentFile.mkdirs(); seed.text = project.file('../../config/sophisticatedcore-common.toml').getText('UTF-8') }
                }
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25641\nlevel-name=matrix\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=0\n'
                new File(directory, 'matrix-result.txt').text = 'NOT_RUN'
                new File(directory, 'expected-mods.txt').text = names.join('\n')
            }
            doLast {
                if (!new File(directory, 'matrix-result.txt').text.startsWith('MATRIX_PASS')) throw new GradleException("Matrix ${combination} failed")
            }
        }
    }
}
