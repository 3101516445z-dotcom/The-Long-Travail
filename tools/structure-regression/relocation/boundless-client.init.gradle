allprojects {
    afterEvaluate {
        sourceSets {
            boundlessClient {
                java.srcDirs = ['tools/structure-regression/relocation/boundless-client']
                resources.srcDir 'tools/structure-regression/relocation/boundless-client-resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.client {
            workingDirectory project.file('build/boundless-client')
            args '--quickPlaySingleplayer', 'visual-world', '--width', '960', '--height', '540'
            mods { travail_boundless_client { source sourceSets.boundlessClient } }
        }
        tasks.matching { it.name == 'runClient' }.configureEach {
            doFirst {
                def world = project.file('build/boundless-client/saves/visual-world')
                if (!new File(world, 'level.dat').exists()) {
                    def seed = project.file(project.findProperty('boundlessSeed') ?: 'build/reading-client/saves/visual-world')
                    if (!new File(seed, 'level.dat').isFile()) throw new GradleException('Prepare an isolated world or pass -PboundlessSeed=<world directory>')
                    project.copy { from seed; into world; exclude 'session.lock' }
                }
                project.file('build/boundless-client/boundless-client-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (project.file('build/boundless-client/boundless-client-result.txt').text.trim() != 'PASS')
                    throw new GradleException('Boundless client checks failed; inspect build/boundless-client.log')
            }
        }
    }
}
