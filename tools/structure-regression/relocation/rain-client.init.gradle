allprojects {
    afterEvaluate {
        if (project.hasProperty('haloModernUI')) {
            repositories.flatDir { dirs 'build/halo-client-libs' }
            dependencies { runtimeOnly fg.deobf('halo:ModernUI-Forge-1.20.1:3.12.0.1:universal') }
        }
        sourceSets {
            rainClient {
                java.srcDirs = ['tools/structure-regression/relocation/rain-client']
                resources.srcDir 'tools/structure-regression/relocation/rain-client-resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.client {
            workingDirectory project.file('build/rain-client')
            args '--quickPlaySingleplayer', 'visual-world', '--width', '960', '--height', '540'
            mods { travail_rain_client { source sourceSets.rainClient } }
        }
        tasks.matching { it.name == 'runClient' }.configureEach {
            doFirst { project.file('build/rain-client/rain-client-result.txt').text = 'NOT_RUN' }
            doLast {
                if (project.file('build/rain-client/rain-client-result.txt').text.trim() != 'PASS')
                    throw new GradleException('Rain client checks failed; inspect build/rain-client.log')
            }
        }
    }
}
