allprojects {
    afterEvaluate {
        def directory = project.file(project.hasProperty('lanternShader') ? 'build/lantern-client-shader' : project.hasProperty('lanternOculus') ? 'build/lantern-client-oculus' : 'build/lantern-client')
        if (project.hasProperty('lanternOculus')) {
            repositories.flatDir { dirs '../../mods' }
            dependencies {
                runtimeOnly fg.deobf('local:oculus:mc1.20.1-1.8.0')
                runtimeOnly fg.deobf('local:embeddium:0.3.31+mc1.20.1')
            }
        }
        sourceSets {
            lanternClient {
                java.srcDir 'tools/structure-regression/relocation/lantern-client'
                resources.srcDir 'tools/structure-regression/relocation/lantern-client-resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.client {
            property 'travail.lantern.shader', project.hasProperty('lanternShader').toString()
            workingDirectory directory
            args '--quickPlaySingleplayer', 'visual-world', '--width', '960', '--height', '540'
            mods { travail_lantern_client { source sourceSets.lanternClient } }
        }
        tasks.matching { it.name == 'runClient' }.configureEach {
            doFirst {
                directory.mkdirs()
                if (project.hasProperty('lanternShader')) {
                    project.copy { from '../../shaderpacks/ComplementaryReimagined_r5.8.1.zip'; into new File(directory, 'shaderpacks') }
                    def config = new File(directory, 'config/oculus.properties')
                    config.parentFile.mkdirs()
                    config.text = 'enableShaders=true\nshaderPack=ComplementaryReimagined_r5.8.1.zip\ndisableUpdateMessage=true\n'
                }
                def world = new File(directory, 'saves/visual-world')
                if (!new File(world, 'level.dat').exists()) {
                    def seed = project.file('build/reading-client/saves/visual-world')
                    if (!new File(seed, 'level.dat').isFile()) seed = project.file('build/rain-client/saves/visual-world')
                    if (!new File(seed, 'level.dat').isFile()) throw new GradleException('Missing visual-world seed in reading-client or rain-client')
                    project.copy { from seed; into world; exclude 'session.lock' }
                }
                new File(directory, 'lantern-client-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (new File(directory, 'lantern-client-result.txt').text.trim() != 'PASS') throw new GradleException('Lantern client checks failed')
            }
        }
    }
}
