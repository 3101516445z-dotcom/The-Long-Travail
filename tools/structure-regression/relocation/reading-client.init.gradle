allprojects {
    afterEvaluate {
        sourceSets {
            readingClient {
                java.srcDirs = ['tools/structure-regression/relocation/reading-client']
                resources.srcDir 'tools/structure-regression/relocation/reading-client-resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.client {
            workingDirectory project.file('build/reading-client')
            args '--quickPlaySingleplayer', 'visual-world', '--width', '960', '--height', '540'
            mods { travail_reading_test { source sourceSets.readingClient } }
        }
        tasks.matching { it.name == 'runClient' }.configureEach {
            def result = project.file('build/reading-client/reading-result.txt')
            doFirst {
                def world = project.file('build/reading-client/saves/visual-world')
                if (!new File(world, 'level.dat').exists()) {
                    def seed = project.file(project.findProperty('readingSeed') ?: 'build/rain-client/saves/visual-world')
                    if (!new File(seed, 'level.dat').exists()) throw new GradleException('Prepare an isolated client world or pass -PreadingSeed=<world directory>')
                    project.copy { from seed; into world; exclude 'session.lock' }
                }
                result.parentFile.mkdirs(); result.text = 'NOT_RUN'
            }
            doLast { if (result.text.trim() != 'PASS') throw new GradleException('Reading regression failed: ' + result.text) }
        }
    }
}
