allprojects {
    afterEvaluate {
        def directory = project.file('build/structure-round-03-' + (project.findProperty('structurePhase') ?: 'after'))
        sourceSets {
            accessoryRestoreTest {
                java.srcDir 'tools/structure-regression/accessory'
                resources.srcDir 'tools/structure-regression/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.server {
            workingDirectory directory
            property 'travail.hotpath.metrics', 'true'
            args '--nogui'
            mods { travail_smoke { source sourceSets.accessoryRestoreTest } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25645\nlevel-name=accessory-restore-test\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=60000\n'
                new File(directory, 'accessory-restore-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (new File(directory, 'accessory-restore-result.txt').text.trim() != 'PASS') throw new GradleException('Accessory restore checks failed')
            }
        }
    }
}
