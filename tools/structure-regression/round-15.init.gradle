allprojects {
    afterEvaluate {
        dependencies { runtimeOnly fg.deobf(project.ext.maidApiDependency) }
        def addonInputs = []
        def sha256 = { file -> java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
        def prepareSocial = {
            def apiDir = project.file('build/optional-api')
            apiDir.mkdirs()
            ['affection', 'personality'].each { key ->
                def candidates = project.file('../../mods').listFiles().findAll { it.name.endsWith('.jar') && it.name.contains(key) }
                if (candidates.size() != 1) throw new GradleException("Expected one installed maid addon: "+key)
                def sourceJar = candidates[0]
                def originalHash = sha256(sourceJar)
                def testVersion = 'structure-' + originalHash.substring(0,12)
                def adapted = new File(apiDir, "${key}-${testVersion}.jar")
                // The release Affection JAR hard-codes SRG names with remap=false.
                // Translate its two server annotation names for this Mojmap development harness only.
                // Personality uses a client lambda rejected by the dev-only safe-referent validator.
                // unsafeRunWhenOn retains the same Dist.CLIENT branch, matching release behavior.
                if (key in ['affection', 'personality']) {
                    new java.util.zip.ZipFile(sourceJar).withCloseable { input ->
                        new java.util.zip.ZipOutputStream(new FileOutputStream(adapted)).withCloseable { output ->
                            input.entries().each { entry ->
                                output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                                byte[] bytes = input.getInputStream(entry).bytes
                                if (entry.name.endsWith('/EntityMaidAccessorMixin.class') || entry.name.endsWith('/EntityLapPillowPoseServerGuardMixin.class') || entry.name.endsWith('/TouhouLittleMaidPersonality.class')) {
                                    // These UTF-8 constant-pool entries have different lengths: replace the length prefix as well.
                                    def raw = new String(bytes, 'ISO-8859-1')
                                    ['m_5677_':'getTypeName', 'm_20124_':'setPose', 'safeRunWhenOn':'unsafeRunWhenOn'].each { oldName, newName ->
                                        raw = raw.replace('\u0001' + ((char)0) + ((char)oldName.length()) + oldName,
                                                          '\u0001' + ((char)0) + ((char)newName.length()) + newName)
                                    }
                                    bytes = raw.getBytes('ISO-8859-1')
                                }
                                output.write(bytes); output.closeEntry()
                            }
                        }
                    }
                } else adapted.bytes = sourceJar.bytes
                addonInputs.add([source:sourceJar.absolutePath,sourceSha256:originalHash,adapted:adapted.absolutePath,adaptedSha256:sha256(adapted),developmentAdaptation:true])
                dependencies { runtimeOnly fg.deobf("local:${key}:${testVersion}") }
            }
        }
        prepareSocial()
        def directory = project.file('build/structure-round-15-' + (project.findProperty('structurePhase') ?: 'after'))
        sourceSets {
            maidCompatTest {
                java.srcDir 'tools/structure-regression/maid'
                resources.srcDir 'tools/structure-regression/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.server {
            workingDirectory directory
            property 'travail.hotpath.metrics', 'true'
            args '--nogui'
            mods { travail_smoke { source sourceSets.maidCompatTest } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory,'addon-inputs.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(addonInputs))
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25657\nlevel-name=maid-compat-test\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=60000\n'
                new File(directory, 'maid-compat-result.txt').text = 'NOT_RUN'
                new File(directory, 'maid-compat-checks.txt').text = 'NOT_RUN'
            }
            doLast {
                addonInputs.each { input -> if (sha256(new File(input.source)) != input.sourceSha256) throw new GradleException("Addon source changed during run") }
                if (new File(directory, 'maid-compat-result.txt').text.trim() != 'PASS') throw new GradleException('Maid compatibility checks failed')
            }
        }
    }
}
