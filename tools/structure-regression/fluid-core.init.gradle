allprojects {
    afterEvaluate {
        sourceSets {
            fluidCoreTest {
                java.srcDir 'tools/structure-regression/fluid'
                resources.srcDir 'tools/structure-regression/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        def directory = project.file('build/fluid-core-server')
        minecraft.runs.server {
            workingDirectory directory
            args '--nogui'
            mods { travail_smoke { source sourceSets.fluidCoreTest } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25658\nlevel-name=fluid-core\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=60000\n'
                new File(directory, 'fluid-core-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (!new File(directory, 'fluid-core-result.txt').text.startsWith('PASS')) throw new GradleException('Fluid core regression failed')
            }
        }
    }
}
