allprojects {
    afterEvaluate {
        sourceSets {
            explorationTest {
                java.srcDir 'tools/structure-regression/exploration'
                resources.srcDir 'tools/structure-regression/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        tasks.named('compileExplorationTestJava') {
            ['JourneyQuerySmoke', 'WayguideCursorChecks', 'FrozenPlacementCursor'].each {
                source project.file("tools/structure-regression/journey/${it}.java")
            }
        }
        def directory = project.file('build/exploration-server')
        minecraft.runs.server {
            workingDirectory directory
            args '--nogui'
            mods { travail_smoke { source sourceSets.explorationTest } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25659\nlevel-name=exploration\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=60000\n'
                new File(directory, 'exploration-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (new File(directory, 'exploration-result.txt').text.trim() != 'PASS')
                    throw new GradleException('Exploration regression failed')
            }
        }
    }
}
