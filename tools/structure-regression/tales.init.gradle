allprojects {
    afterEvaluate {
        sourceSets {
            talesTest {
                java.srcDir 'tools/structure-regression/tales'
                resources.srcDir 'tools/structure-regression/tales-resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        def directory = project.file('build/tales-server')
        minecraft.runs.server {
            workingDirectory directory
            jvmArgs '-Xmx3G'
            args '--nogui'
            property 'mixin.debug.countInjections', 'true'
            mods { travail_smoke { source sourceSets.talesTest } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25749\nlevel-name=tales\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=180000\n'
                new File(directory, 'tales-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (!new File(directory, 'tales-result.txt').text.startsWith('PASS ')) throw new GradleException('Tales regression failed')
            }
        }
    }
}
