// Package independent test fixtures for the installed Forge server runtime.
allprojects {
    afterEvaluate {
        def suites = [
            direct: ['tools/structure-regression/direct-compat'],
            maid: ['tools/structure-regression/maid'],
            fluid: ['tools/backpack-fluid-smoke', 'tools/rs-fluid-smoke', 'tools/ae-fluid-smoke', 'tools/fluid-matrix-smoke', 'tools/structure-regression/rsi153']
        ]
        suites.each { name, sources ->
            def set = sourceSets.create("release${name.capitalize()}") {
                java.srcDirs = sources
                resources.srcDir name == 'fluid' ? 'tools/smoke-resources' : 'tools/structure-regression/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            }
            def jarTask = "${name}AcceptanceJar"
            tasks.register(jarTask, Jar) {
                from set.output
                archiveBaseName = "travail-${name}-acceptance"
                archiveVersion = '1'
            }
            reobf.create(jarTask) { classpath.from set.compileClasspath }
        }
    }
}
