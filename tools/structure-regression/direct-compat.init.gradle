allprojects {
    afterEvaluate {
        def profile = project.findProperty('directProfile') ?: 'absent'
        if (!(profile in ['absent', 'small', 'rsi-new'])) throw new GradleException('Unknown directProfile')
        if (profile == 'small') {
            ['attributeslib','ftbteams','ftblibrary','architectury','gravestone'].each { name ->
                dependencies.add('runtimeOnly', fg.deobf("travail.optional:${name}:local"))
            }
            dependencies.add('runtimeOnly', fg.deobf('maven.modrinth:placebo:6SkuAGoz'))
        }
        if (profile == 'rsi-new') {
            dependencies.add('runtimeOnly', fg.deobf('travail.optional:refinedstorage:local'))
            // 使用当前支持的 API 检查无效引用。
            dependencies.add('runtimeOnly', fg.deobf('travail.optional:rs_integration:local'))
        }
        sourceSets {
            directCompat {
                java.srcDir 'tools/structure-regression/direct-compat'
                resources.srcDir 'tools/structure-regression/resources'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        def directory = project.file(project.hasProperty('directRun') ? 'build/reflection-removal/' + project.property('directRun') : ('build/reflection-removal/' + profile))
        minecraft.runs.server {
            workingDirectory directory
            args '--nogui'
            mods { travail_smoke { source sourceSets.directCompat } }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            doFirst {
                directory.mkdirs()
                new File(directory, 'eula.txt').text = project.file('run/eula.txt').text
                new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25749\nlevel-name=direct-test\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=120000\n'
                new File(directory, 'direct-result.txt').text = 'NOT_RUN'
            }
            doLast {
                if (!new File(directory, 'direct-result.txt').text.startsWith('PASS')) throw new GradleException('Direct compatibility checks failed')
            }
        }
    }
}
